# Production deployment (release gate). dev-only docker-compose.yml is untouched.
#
# Images must be built first from the repository root:
#   docker build -f Dockerfile.api -t growth-operator-api:<tag> .
#   docker build -f Dockerfile.web -t growth-operator-web:<tag> .
#
# Then, with a production .env beside this file (see docs/operations/):
#   docker compose -f docker-compose.prod.yml up -d
#
# Notes enforced by this file (not by convention):
# - Exactly ONE worker container: services default to a single replica; never
#   run with `--scale worker=N` above 1. pg-boss claiming plus idempotency
#   keys make double execution safe, but a single worker is the supported
#   topology (there is no cross-process leader election).
# - `migrate` is a one-shot (`restart: "no"`): schema moves only forward via
#   `prisma migrate deploy`. There is no automatic down-migration.
# - The database port is NOT published: only compose-network services reach it.
# - API and worker restart automatically unless explicitly stopped.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growth_operator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-growth_operator}
    volumes:
      - growth_operator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growth_operator}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: growth-operator-api:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-growth_operator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-growth_operator}?schema=public
    command: ["pnpm", "--filter", "@growth-operator/db", "db:migrate"]
    restart: "no"

  api:
    image: growth-operator-api:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-growth_operator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-growth_operator}?schema=public
      PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    stop_grace_period: 30s

  worker:
    image: growth-operator-api:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-growth_operator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-growth_operator}?schema=public
    command: ["node", "apps/api/dist/worker/index.js"]
    stop_grace_period: 60s

  web:
    image: growth-operator-web:${IMAGE_TAG:-latest}
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  growth_operator_postgres_data:
