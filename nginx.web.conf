# Release gate: static host for the built SPA.
# /api/ must be proxied to the API service by the operator's reverse proxy.
# When served behind docker-compose.prod.yml, replace `api:3001` handling by
# routing /api/ to the api service at the edge (not in this file).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
