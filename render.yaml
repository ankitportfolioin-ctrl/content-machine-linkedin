services:
  # PostgreSQL Database
  - type: pserv
    name: growth-operator-db
    plan: starter
    region: oregon
    databaseName: growth_operator
    user: growth_operator
    postgresMajorVersion: "17"

  # Redis
  - type: redis
    name: growth-operator-redis
    plan: starter
    region: oregon
    redisVersion: "7"

  # API Service
  - type: web
    name: growth-operator-api
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/ankitportfolioin-ctrl/content-machine-linkedin
    branch: main
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: growth-operator-db
          property: connectionString
      - key: TEST_DATABASE_URL
        fromDatabase:
          name: growth-operator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: growth-operator-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        value: https://growth-operator-web.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o-mini"
      - key: SOCIAL_CONNECTOR_KEY
        generateValue: true
      - key: SOCIAL_REDIRECT_URI
        value: https://growth-operator-api.onrender.com/api/v1/social/callback
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

  # Web Frontend (Static Site)
  - type: web
    name: growth-operator-web
    runtime: static
    plan: free
    region: oregon
    repo: https://github.com/ankitportfolioin-ctrl/content-machine-linkedin
    branch: main
    rootDir: apps/web
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://growth-operator-api.onrender.com
      - key: VITE_WEB_URL
        value: https://growth-operator-web.onrender.com