databases:
  - name: growth-operator-db
    plan: starter
    region: oregon
    databaseName: growth_operator
    user: growth_operator
    postgresMajorVersion: "17"

services:
  # API Service (Node.js web service)
  - type: web
    name: growth-operator-api
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/ankitportfolioin-ctrl/content-machine-linkedin
    branch: main
    rootDir: .
    buildCommand: |
      pnpm install --frozen-lockfile &&
      pnpm --filter @growth-operator/schemas build &&
      pnpm --filter @growth-operator/db db:generate &&
      pnpm --filter @growth-operator/db build &&
      pnpm --filter @growth-operator/shared build &&
      pnpm --filter @growth-operator/ai build &&
      pnpm --filter @growth-operator/capabilities build &&
      pnpm --filter @growth-operator/intelligence build &&
      pnpm --filter @growth-operator/content build &&
      pnpm --filter @growth-operator/sales build &&
      pnpm --filter @growth-operator/learning build &&
      pnpm --filter @growth-operator/decision build &&
      pnpm --filter @growth-operator/social build &&
      pnpm --filter @growth-operator/business build &&
      pnpm --filter @growth-operator/api build
    preDeployCommand: pnpm --filter @growth-operator/db db:migrate
    startCommand: pnpm --filter @growth-operator/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: growth-operator-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        value: https://growth-operator-web.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o-mini"
      - key: SOCIAL_CONNECTOR_KEY
        generateValue: true
      - key: SOCIAL_REDIRECT_URI
        value: https://growth-operator-api.onrender.com/api/v1/social/callback
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_ACCESS_TOKEN
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false

  # Background Worker (pg-boss daily loop worker)
  - type: worker
    name: growth-operator-worker
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/ankitportfolioin-ctrl/content-machine-linkedin
    branch: main
    rootDir: .
    buildCommand: |
      pnpm install --frozen-lockfile &&
      pnpm --filter @growth-operator/schemas build &&
      pnpm --filter @growth-operator/db db:generate &&
      pnpm --filter @growth-operator/db build &&
      pnpm --filter @growth-operator/shared build &&
      pnpm --filter @growth-operator/ai build &&
      pnpm --filter @growth-operator/capabilities build &&
      pnpm --filter @growth-operator/intelligence build &&
      pnpm --filter @growth-operator/content build &&
      pnpm --filter @growth-operator/sales build &&
      pnpm --filter @growth-operator/learning build &&
      pnpm --filter @growth-operator/decision build &&
      pnpm --filter @growth-operator/social build &&
      pnpm --filter @growth-operator/business build &&
      pnpm --filter @growth-operator/api build
    startCommand: pnpm --filter @growth-operator/api worker:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: growth-operator-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o-mini"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Web Frontend (Static Site)
  - type: web
    name: growth-operator-web
    runtime: static
    plan: free
    repo: https://github.com/ankitportfolioin-ctrl/content-machine-linkedin
    branch: main
    rootDir: .
    buildCommand: |
      pnpm install --frozen-lockfile &&
      pnpm --filter @growth-operator/schemas build &&
      pnpm --filter @growth-operator/db db:generate &&
      pnpm --filter @growth-operator/db build &&
      pnpm --filter @growth-operator/shared build &&
      pnpm --filter @growth-operator/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://growth-operator-api.onrender.com
      - key: VITE_WEB_URL
        value: https://growth-operator-web.onrender.com